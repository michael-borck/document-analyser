[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-analyser"
version = "0.7.1"
description = "Multi-modal document analysis microservice — extracts text, readability, and structure from PDFs, DOCX, and more"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Borck", email = "michael.borck@curtin.edu.au" }]
keywords = ["document", "analysis", "nlp", "pdf", "fastapi", "lens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core service (required for the package to import and serve)
    "lens-contract>=0.3.0",  # manifest + /health + /manifest + CORS + optional auth scaffolding
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",  # per-route rate limiting (kept; not via lens-contract)
    "httpx>=0.26.0",
    # Text extraction
    "pdfplumber>=0.10.3",
    "pypdf>=4.0.0",
    "markitdown[docx,pptx,xlsx]>=0.1.0",
    # Slide-design analysis (deck structure that markitdown's text path discards)
    "python-pptx>=0.6.21",
    # Basic text analysis
    "textstat>=0.7.3",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Heavy ML libs needed by the semantic/sentiment/NER analysers.
# Optional because (a) the analysers degrade to None gracefully and the rest
# of the API still works, and (b) loading torch + sentence-transformers +
# spacy + transformers in one Python process is brittle on macOS.
nlp = [
    "sentence-transformers>=2.5.0",
    "spacy>=3.7.0",
    "transformers>=4.36.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
]
# Convenience: `pip install document-analyser[full]` installs everything.
full = [
    "document-analyser[nlp]",
]

# Local dev: resolve lens-contract from the sibling checkout. uv strips this from
# the published wheel, which keeps the plain `lens-contract>=0.2.0` PyPI pin.
[tool.uv.sources]
lens-contract = { path = "../lens-contract", editable = true }

[project.scripts]
document-analyser = "document_analyser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["document_analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# By default skip tests that need real ML models (sentence-transformers,
# spacy NER, transformers sentiment). Those tests load heavy native libraries
# that intermittently segfault on macOS when combined in one Python process.
# Run them explicitly with `pytest -m slow` (typically before a release).
addopts = "-m 'not slow'"
markers = [
    "slow: tests that load real ML models — opt-in, may be flaky on macOS",
]
