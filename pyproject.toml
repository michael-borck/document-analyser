[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-analyser"
version = "0.11.0"
description = "Multi-modal document analysis microservice — extracts text, readability, and structure from PDFs, DOCX, and more"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Borck", email = "michael.borck@curtin.edu.au" }]
keywords = ["document", "analysis", "nlp", "pdf", "fastapi", "lens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core service (required for the package to import and serve)
    "lens-contract>=0.3.0",  # manifest + /health + /manifest + CORS + optional auth scaffolding
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",  # per-route rate limiting (kept; not via lens-contract)
    "httpx>=0.26.0",
    # Text extraction
    "pdfplumber>=0.10.3",
    "pypdf>=4.0.0",
    # Embedded-image extraction (pypdf page.images needs a decoder; renditions)
    "pillow>=10.0.0",
    "markitdown[docx,pptx,xlsx]>=0.1.0",
    # Slide-design analysis (deck structure that markitdown's text path discards)
    "python-pptx>=0.6.21",
    # Basic text analysis
    "textstat>=0.7.3",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
    "keyring>=25.7.0",
    "platformdirs>=4.10.0",
]

[project.optional-dependencies]
# Semantic + sentiment analysers run on ONNX Runtime (torch-free). The MiniLM
# embeddings and distilbert-sst2 sentiment models are pre-exported ONNX variants
# loaded via onnxruntime + the Rust `tokenizers` lib — no torch, no transformers,
# no sentence-transformers (drops ~300-700 MB from a frozen/desktop build).
# Outputs are identical to the torch models (embeddings cosine 1.0; sentiment
# labels+scores match). Analysers still degrade to None gracefully if absent.
nlp = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
]
# spaCy NER (/advanced) — opt-in, not needed by the semantic analysers. Kept
# separate so `[nlp]` stays lean and torch/transformers-free.
ner = [
    "spacy>=3.7.0",
]
# Document embedding via the family's shared helper (one pinned model so the
# vector is comparable across members — for cross-artefact + distinctiveness
# signals). Opt-in: without it, `AnalysisResults.embedding` is simply None.
embeddings = [
    "lens-embed[text]>=0.1.1",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
]
# Convenience: `pip install document-analyser[full]` installs everything.
full = [
    "document-analyser[nlp]",
    "document-analyser[embeddings]",
]

# Local dev: resolve family siblings from local checkouts. uv strips these from
# the published wheel, which keeps the plain PyPI pins.
[tool.uv.sources]
lens-contract = { path = "../lens-contract", editable = true }
lens-embed = { path = "../lens-embed", editable = true }

[project.scripts]
document-analyser = "document_analyser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["document_analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# By default skip tests that need real ML models (sentence-transformers,
# spacy NER, transformers sentiment). Those tests load heavy native libraries
# that intermittently segfault on macOS when combined in one Python process.
# Run them explicitly with `pytest -m slow` (typically before a release).
addopts = "-m 'not slow'"
markers = [
    "slow: tests that load real ML models — opt-in, may be flaky on macOS",
]
